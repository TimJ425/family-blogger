{% from 'macros.html' import icon %}
<a href="{{ url_for('posts.delete_post', post_id=post.id, next=(delete_next if delete_next is defined and delete_next else none)) }}" class="btn btn-danger btn-small" data-confirm-post="Delete this post?" data-csrf="{{ csrf_token() }}"{% if delete_next is defined and delete_next %} data-next="{{ delete_next }}"{% endif %}>{{ icon('trash') }} Delete</a>
